# Producción: build de Vite servido por `server/index.js` en el puerto 3003.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# El `.env` del proyecto lo lee el contenedor en runtime (env_file). Ya no hay
# build args: desde que el navegador dejó de hablar con Supabase no queda
# ninguna VITE_* que incrustar en el bundle.
#
# El puerto se publica en 3003 del host, que es a donde cloudflared enruta
# inv.mercadoelineas.com (/etc/cloudflared/config.yml). El Caddy del servidor
# está puenteado: tiene una regla para este dominio, pero el tráfico entra por
# el túnel y nunca pasa por él.
#
# OJO: `image` y `container_name` coinciden con los del despliegue anterior, así
# que un `up --build` sustituye el sistema en vivo y pisa la imagen vieja. Antes
# de hacerlo, guárdala:  docker tag inventario-prod inventario-prod:respaldo

# Nombre de proyecto propio: sin él, dev y prod comparten el proyecto derivado
# del directorio y el mismo servicio `app`, así que levantar uno recrearía —y
# tumbaría— el otro.
name: inventario-prod

services:
  # No llamar `app` a este servicio: su nombre es un alias DNS en cada red a la
  # que se une, y el proxy de elineas-transferencia descubre sus réplicas
  # resolviendo `app` dentro de elineas-transferencia_default. Al unirnos a esa
  # red para poder llamar a su API, nuestro contenedor empezó a contestar a
  # peticiones que no eran suyas y aparecieron 502 intermitentes en su lado.
  #
  # Se arregló en el servidor antes que aquí; esto trae el cambio al repo para
  # que un despliegue desde cero no lo repita.
  inventario:
    build:
      context: .
      dockerfile: Dockerfile
    image: inventario-prod
    container_name: inventario-prod
    restart: unless-stopped
    # Endurecimiento: sin root/capabilities/escalada, FS de solo lectura y
    # límites de recursos (ajustar mem_limit si el servicio sufre OOM).
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    env_file:
      - .env
    # PORT se fija aquí y no se toma del .env: la imagen expone 3003 y el
    # mapeo de abajo apunta a 3003. Cambiar solo el .env descuadraría ambos.
    environment:
      PORT: 3003
      NODE_ENV: production
    ports:
      - "3003:3003"
    # La base vive en el contenedor ELINEAS_BD, al que se llega por esta red
    # usando su NOMBRE como host (las IP cambian al recrear un contenedor).
    # DATABASE_URL, AUTH_API_URL y SYSTEM_SLUG llegan por el env_file de arriba.
    networks:
      - elineas_default
      # Los ajustes y procesamientos hablan con elineas-transferencia, que no
      # está en elineas_default sino en la red de su propio compose. Sin esto
      # el contenedor ni siquiera resuelve su nombre («bad address») y la
      # pantalla de ajustes responde «respuesta inesperada de la API».
      #
      # Entrar en la red de otro tiene un precio: el nombre del servicio pasa a
      # ser un alias DNS ahí dentro. Por eso este no se llama `app` (ver
      # arriba). Cuidado al añadir más redes ajenas por el mismo motivo.
      - elineas-transferencia_default

networks:
  elineas_default:
    external: true
  elineas-transferencia_default:
    external: true
