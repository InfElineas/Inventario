# Server block del contenedor de producción. Reemplaza el default.conf de la
# imagen, que escucha en el 8080.
#
# Va dentro del http{} de /etc/nginx/nginx.conf (la imagen hace
# `include /etc/nginx/conf.d/*.conf`), por eso aquí solo hay un `server`.

server {
    listen 3003;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip              on;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary         on;

    # Ojo: `add_header` NO se hereda en un bloque hijo que define sus propios
    # `add_header`, así que las cabeceras de seguridad se repiten en cada
    # location. Replican las que vite.config.js pone en dev, para que dev y prod
    # no divergan. El Caddy externo añade encima las de TLS.

    # Los assets de Vite llevan hash en el nombre: cachearlos "para siempre" no
    # sirve contenido viejo bajo una URL vieja.
    location /assets/ {
        add_header X-Content-Type-Options nosniff                     always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Cache-Control          "public, max-age=31536000, immutable" always;
    }

    # index.html cambia en cada build; cachearlo dejaría al cliente pidiendo
    # assets con hashes que ya no existen.
    location = /index.html {
        add_header X-Content-Type-Options nosniff                     always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        add_header Cache-Control          "no-cache"                  always;
    }

    # SPA: las rutas de react-router (/productos…) no son archivos reales, así
    # que todo lo que no exista en disco cae en index.html.
    location / {
        add_header X-Content-Type-Options nosniff                     always;
        add_header Referrer-Policy        strict-origin-when-cross-origin always;
        try_files $uri $uri/ /index.html;
    }
}
