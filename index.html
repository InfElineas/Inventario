<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- Apuntaba a /favicon.ico, que no existe: la pestaña salía sin icono y
         con varias abiertas no se distinguía cuál era el inventario. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#4ade80" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ELíneas — Inventario</title>

    <!-- Las cabeceras de seguridad van como HTTP headers (src/server/securityHeaders.js):
         dentro de un <meta> el navegador las ignora. -->
    <!-- Theme init: apply saved theme before React loads to prevent flash -->
    <script>
      (function() {
        var t = localStorage.getItem('elineas_theme') || 'dark';
        document.documentElement.classList.add(t);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
